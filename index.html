<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moodi — Inspiration</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #faf8f7;
      color: #222;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250,248,247,0.95);
      backdrop-filter: blur(12px);
      padding: 14px 18px;
      border-bottom: 1px solid #eee;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 15px;
      max-width: 1200px;
      margin: auto;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .search {
      flex: 1;
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 13px 18px 13px 43px;
      border: none;
      outline: none;
      border-radius: 30px;
      background: #eeeae8;
      font-size: 15px;
    }

    .search span {
      position: absolute;
      left: 16px;
      top: 12px;
      font-size: 18px;
    }

    .profile {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #222;
      color: white;
      font-weight: bold;
    }

    /* CATEGORIES */
    .categories {
      max-width: 1200px;
      margin: 18px auto;
      padding: 0 18px;
      display: flex;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      border: none;
      background: white;
      padding: 10px 17px;
      border-radius: 25px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .category.active {
      background: #222;
      color: white;
    }

    /* HERO */
    .hero {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .hero h1 {
      font-size: clamp(30px, 6vw, 55px);
      line-height: 1;
      margin-bottom: 10px;
    }

    .hero p {
      color: #777;
      font-size: 16px;
    }

    /* PINTEREST GRID */
    .feed {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 18px;
      columns: 5 180px;
      column-gap: 15px;
    }

    .card {
      position: relative;
      display: inline-block;
      width: 100%;
      margin-bottom: 15px;
      border-radius: 18px;
      overflow: hidden;
      background: white;
      break-inside: avoid;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .card img {
      width: 100%;
      display: block;
      transition: transform .3s ease;
    }

    .card:hover img {
      transform: scale(1.03);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.05),
        rgba(0,0,0,.65)
      );
      opacity: 0;
      transition: .25s;
    }

    .card:hover .overlay {
      opacity: 1;
    }

    .save {
      position: absolute;
      top: 12px;
      right: 12px;
      border: none;
      background: #e60023;
      color: white;
      padding: 10px 15px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      opacity: 0;
      transition: .25s;
      z-index: 2;
    }

    .card:hover .save {
      opacity: 1;
    }

    .save.saved {
      background: #222;
    }

    .info {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
      color: white;
      opacity: 0;
      transition: .25s;
      z-index: 2;
    }

    .card:hover .info {
      opacity: 1;
    }

    .info h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .info span {
      font-size: 12px;
      opacity: .85;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .top {
        gap: 9px;
      }

      .logo {
        font-size: 22px;
      }

      .profile {
        width: 35px;
        height: 35px;
      }

      .feed {
        columns: 2;
        column-gap: 9px;
        padding: 0 10px;
      }

      .card {
        margin-bottom: 9px;
        border-radius: 13px;
      }

      .save {
        opacity: 1;
        padding: 7px 11px;
        font-size: 12px;
      }

      .info {
        opacity: 1;
      }

      .hero {
        padding: 0 12px;
      }

      .categories {
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">

    <div class="logo">moodi.</div>

    <div class="search">
      <span>🔍</span>
      <input
        type="text"
        id="searchInput"
        placeholder="Search inspiration..."
      >
    </div>

    <div class="profile">M</div>

  </div>
</header>


<!-- CATEGORIES -->

<div class="categories">

  <button class="category active" data-category="all">
    ✨ All
  </button>

  <button class="category" data-category="fashion">
    👗 Fashion
  </button>

  <button class="category" data-category="hair">
    💇 Hair
  </button>

  <button class="category" data-category="beauty">
    💄 Beauty
  </button>

  <button class="category" data-category="room">
    🏠 Room
  </button>

  <button class="category" data-category="study">
    📚 Study
  </button>

  <button class="category" data-category="aesthetic">
    🌷 Aesthetic
  </button>

</div>


<!-- HERO -->

<section class="hero">
  <h1>Find your mood.</h1>
  <p>Save the things that inspire you ✨</p>
</section>


<!-- FEED -->

<main class="feed" id="feed"></main>


<script>

const inspirations = [

  {
    title: "Soft Outfit",
    category: "fashion",
    image: "https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Cozy Room",
    category: "room",
    image: "https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Natural Hair",
    category: "hair",
    image: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Study Mood",
    category: "study",
    image: "https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Minimal Beauty",
    category: "beauty",
    image: "https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Dreamy Aesthetic",
    category: "aesthetic",
    image: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Street Style",
    category: "fashion",
    image: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Clean Girl Hair",
    category: "hair",
    image: "https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Cute Desk",
    category: "study",
    image: "https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Peaceful Corner",
    category: "room",
    image: "https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Simple Makeup",
    category: "beauty",
    image: "https://images.unsplash.com/photo-1526045478516-99145907023c?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Pink Mood",
    category: "aesthetic",
    image: "https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Casual Look",
    category: "fashion",
    image: "https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Warm Bedroom",
    category: "room",
    image: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Morning Study",
    category: "study",
    image: "https://images.unsplash.com/photo-1456324504439-367cee3b3c32?auto=format&fit=crop&w=700&q=85"
  },

  {
    title: "Soft Flowers",
    category: "aesthetic",
    image: "https://images.unsplash.com/photo-1495231916356-a86217efff12?auto=format&fit=crop&w=700&q=85"
  }

];


const feed = document.getElementById("feed");
const searchInput = document.getElementById("searchInput");

let currentCategory = "all";


/* LOAD SAVED ITEMS */

let savedItems =
  JSON.parse(localStorage.getItem("moodiSaved")) || [];


/* DISPLAY FEED */

function displayFeed() {

  const search =
    searchInput.value.toLowerCase().trim();

  feed.innerHTML = "";

  const filtered = inspirations.filter(item => {

    const matchesCategory =
      currentCategory === "all" ||
      item.category === currentCategory;

    const matchesSearch =
      item.title.toLowerCase().includes(search) ||
      item.category.toLowerCase().includes(search);

    return matchesCategory && matchesSearch;

  });


  if (filtered.length === 0) {

    feed.innerHTML = `
      <div style="
        text-align:center;
        padding:50px 10px;
        color:#777;
        column-span:all;
      ">
        <h2>No inspiration found 🥲</h2>
        <p>Try another search.</p>
      </div>
    `;

    return;
  }


  filtered.forEach((item, index) => {

    const isSaved =
      savedItems.includes(item.image);

    const card = document.createElement("article");

    card.className = "card";

    card.innerHTML = `

      <img
        src="${item.image}"
        alt="${item.title}"
        loading="lazy"
      >

      <div class="overlay"></div>

      <button
        class="save ${isSaved ? "saved" : ""}"
        onclick="toggleSave('${item.image}', this)"
      >
        ${isSaved ? "✓ Saved" : "Save"}
      </button>

      <div class="info">
        <h3>${item.title}</h3>
        <span>#${item.category}</span>
      </div>

    `;

    feed.appendChild(card);

  });

}


/* SAVE / UNSAVE */

function toggleSave(image, button) {

  if (savedItems.includes(image)) {

    savedItems =
      savedItems.filter(item => item !== image);

    button.classList.remove("saved");
    button.textContent = "Save";

  } else {

    savedItems.push(image);

    button.classList.add("saved");
    button.textContent = "✓ Saved";

  }

  localStorage.setItem(
    "moodiSaved",
    JSON.stringify(savedItems)
  );

}


/* CATEGORY BUTTONS */

document
  .querySelectorAll(".category")
  .forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll(".category")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      button.classList.add("active");

      currentCategory =
        button.dataset.category;

      displayFeed();

    });

  });


/* SEARCH */

searchInput.addEventListener(
  "input",
  displayFeed
);


/* START */

displayFeed();

</script>

</body>
</html>
