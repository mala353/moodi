<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moodi ✨</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#faf7f5;
  color:#292525;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(250,247,245,.95);
  backdrop-filter:blur(10px);
  padding:14px 18px;
  border-bottom:1px solid #eee;
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  font-size:27px;
  font-weight:800;
  color:#e85d75;
}

.search{
  flex:1;
  padding:12px 17px;
  border:none;
  outline:none;
  border-radius:25px;
  background:#eee9e7;
  font-size:15px;
}

/* CATEGORIES */
.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-top:13px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  border:none;
  padding:9px 15px;
  border-radius:20px;
  background:#eee9e7;
  white-space:nowrap;
  cursor:pointer;
}

.category.active{
  background:#292525;
  color:white;
}

/* FEED */
.feed{
  columns:2;
  column-gap:12px;
  padding:15px;
}

.card{
  break-inside:avoid;
  margin-bottom:12px;
  background:white;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
}

.card img{
  width:100%;
  display:block;
}

.card-info{
  padding:10px;
}

.title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:5px;
}

.creator{
  font-size:12px;
  color:#777;
}

/* PROFILE */
.profile{
  display:none;
  padding:20px;
}

.back{
  border:none;
  background:#eee9e7;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
  margin-bottom:20px;
}

.profile-head{
  text-align:center;
  margin-bottom:25px;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:10px;
}

.profile-name{
  font-size:23px;
  font-weight:bold;
}

.profile-id{
  color:#e85d75;
  margin-top:4px;
}

.bio{
  color:#777;
  margin-top:8px;
}

/* PROFILE PICTURES */
.gallery{
  columns:2;
  column-gap:12px;
}

.gallery-card{
  break-inside:avoid;
  margin-bottom:12px;
  border-radius:16px;
  overflow:hidden;
  background:white;
}

.gallery-card img{
  width:100%;
  display:block;
}

.gallery-title{
  padding:10px;
  font-size:14px;
  font-weight:bold;
}

/* EMPTY */
.empty{
  text-align:center;
  padding:50px 20px;
  color:#888;
}

/* DESKTOP */
@media(min-width:700px){

  .feed{
    columns:4;
    max-width:1200px;
    margin:auto;
  }

  .gallery{
    columns:4;
    max-width:1200px;
    margin:auto;
  }

  header{
    padding-left:40px;
    padding-right:40px;
  }
}
</style>
</head>

<body>

<header>

  <div class="top">

    <div class="logo">
      Moodi ✨
    </div>

    <input
      class="search"
      id="search"
      placeholder="Search inspo..."
    >

  </div>

  <div class="categories">

    <button class="category active" data-category="all">
      All
    </button>

    <button class="category" data-category="fashion">
      👗 Fashion
    </button>

    <button class="category" data-category="hair">
      💇 Hair
    </button>

    <button class="category" data-category="beauty">
      💄 Beauty
    </button>

    <button class="category" data-category="room">
      🛋️ Room
    </button>

    <button class="category" data-category="study">
      📚 Study
    </button>

    <button class="category" data-category="aesthetic">
      ✨ Aesthetic
    </button>

  </div>

</header>


<!-- HOME FEED -->

<main id="home">

  <div class="feed" id="feed"></div>

</main>


<!-- CREATOR PROFILE -->

<section class="profile" id="profile">

  <button class="back" onclick="goHome()">
    ← Back

  <div class="profile-head">

    <img class="avatar" id="profileAvatar">

    <div class="profile-name" id="profileName"></div>

    <div class="profile-id" id="profileId"></div>

    <div class="bio" id="profileBio"></div>

  <div class="gallery" id="gallery"></div>

</section>

/* =====================================================
   CREATE ALL POSTS
   ===================================================== */

function getAllPosts(){

  let posts = [];

  creators.forEach(creator => {

    creator.pictures.forEach((picture,index) => {

      posts.push({

        ...picture,

        creatorId:creator.id,

        creatorName:creator.name,

        creatorAvatar:creator.avatar,

        pictureIndex:index

      });

    });

  });

  return posts;
}


/* =====================================================
   DISPLAY HOME FEED
   ===================================================== */

function displayFeed(){

  const feed =
  document.getElementById("feed");

  const search =
  document.getElementById("search")
  .value
  .toLowerCase();

  const activeCategory =
  document.querySelector(".category.active")
  .dataset.category;

  const posts = getAllPosts();

  const filtered =
  posts.filter(post => {

    const matchesSearch =
      post.title.toLowerCase().includes(search) ||
      post.creatorName.toLowerCase().includes(search) ||
      post.creatorId.toLowerCase().includes(search) ||
      post.category.toLowerCase().includes(search);

    const matchesCategory =
      activeCategory === "all" ||
      post.category === activeCategory;

    return matchesSearch && matchesCategory;

  });


  feed.innerHTML = "";


  if(filtered.length === 0){

    feed.innerHTML =
    `<div class="empty">
      😭<br><br>
      No inspo found
    </div>`;

    return;
  }


  filtered.forEach(post => {

    const card =
    document.createElement("div");

    card.className = "card";


    card.innerHTML = `

      <img
        src="${post.image}"
        alt="${post.title}"
      >

      <div class="card-info">

        <div class="title">
          ${post.title}
        </div>

        <div class="creator">
          ${post.creatorName}
          · @${post.creatorId}
        </div>

      </div>

    `;


    /*
      CLICKING AN INSPO
      OPENS THAT PERSON'S PROFILE
    */

    card.onclick = () =>
      openCreator(post.creatorId);


    feed.appendChild(card);

  });

}


/* =====================================================
   OPEN CREATOR
   ===================================================== */

function openCreator(id){

  const creator =
    creators.find(c => c.id === id);

  if(!creator) return;


  document.getElementById("home")
  .style.display = "none";


  document.querySelector("header")
  .style.display = "none";


  const profile =
    document.getElementById("profile");

  profile.style.display = "block";


  document.getElementById("profileAvatar")
  .src = creator.avatar;


  document.getElementById("profileName")
  .textContent = creator.name;


  document.getElementById("profileId")
  .textContent = "@" + creator.id;


  document.getElementById("profileBio")
  .textContent = creator.bio;


  const gallery =
    document.getElementById("gallery");

  gallery.innerHTML = "";


  creator.pictures.forEach(picture => {

    const card =
    document.createElement("div");

    card.className =
    "gallery-card";


    card.innerHTML = `

      <img
        src="${picture.image}"
        alt="${picture.title}"
      >

      <div class="gallery-title">
        ${picture.title}
      </div>

    `;


    gallery.appendChild(card);

  });


  window.scrollTo(0,0);

}


/* =====================================================
   GO HOME
   ===================================================== */

function goHome(){

  document.getElementById("profile")
  .style.display = "none";


  document.getElementById("home")
  .style.display = "block";


  document.querySelector("header")
  .style.display = "block";


  window.scrollTo(0,0);

}


/* =====================================================
   SEARCH
   ===================================================== */

document
.getElementById("search")
.addEventListener("input", displayFeed);


/* =====================================================
   CATEGORY BUTTONS
   ===================================================== */

document
.querySelectorAll(".category")
.forEach(button => {

  button.addEventListener("click", () => {

    document
    .querySelectorAll(".category")
    .forEach(btn =>
      btn.classList.remove("active")
    );


    button.classList.add("active");


    displayFeed();

  });

});


/* =====================================================
   START MOODI
   ===================================================== */
