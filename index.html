<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6d8ff">
<meta name="description" content="Moodi — Find your mood. Create your vibe.">
<title>Moodi — Inspo & Edit</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  color:#292238;
  background:
    radial-gradient(circle at 10% 10%,#ffd9ec 0,transparent 30%),
    radial-gradient(circle at 90% 10%,#d9d8ff 0,transparent 30%),
    radial-gradient(circle at 50% 100%,#d7f5ff 0,transparent 35%),
    #faf8ff;
  transition:.3s;
}

body.dark{
  color:#f5f1ff;
  background:
    radial-gradient(circle at 10% 10%,#4c3152 0,transparent 30%),
    radial-gradient(circle at 90% 10%,#34366a 0,transparent 30%),
    #151321;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:min(1100px,100%);
  margin:auto;
  padding:20px 18px 100px;
}

/* HEADER */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:25px;
  font-weight:800;
}

.logo-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,#ffb7d8,#c9b8ff,#aeeaff);
  box-shadow:0 8px 25px #bda9df55;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#ffffff88;
  backdrop-filter:blur(15px);
  color:inherit;
  font-size:18px;
}

.dark .icon-btn{
  background:#ffffff12;
}

/* PAGES */

.page{
  display:none;
  animation:fade .25s ease;
}

.page.active{
  display:block;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  min-height:250px;
  padding:30px;
  border:1px solid #ffffffaa;
  border-radius:30px;
  background:
    linear-gradient(135deg,#ffd7e9dd,#e2d8ffdd,#ccefffdd);
  box-shadow:0 18px 50px #9b83c530;
}

.dark .hero{
  background:linear-gradient(135deg,#472d48,#34335d,#273d4b);
  border-color:#ffffff15;
}

.hero::before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  right:-30px;
  top:-40px;
  border-radius:50%;
  background:#ffffff55;
}

.hero h1{
  position:relative;
  font-size:clamp(32px,7vw,58px);
  line-height:1;
  max-width:600px;
  margin-bottom:14px;
}

.hero p{
  position:relative;
  font-size:16px;
  opacity:.75;
  margin-bottom:24px;
}

.hero-buttons{
  position:relative;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.primary{
  padding:13px 19px;
  border-radius:15px;
  background:#292238;
  color:white;
  font-weight:700;
  box-shadow:0 8px 20px #29223830;
}

.dark .primary{
  background:#f6efff;
  color:#292238;
}

.secondary{
  padding:13px 19px;
  border-radius:15px;
  background:#ffffff80;
  color:inherit;
  font-weight:700;
  backdrop-filter:blur(10px);
}

/* SECTION */

.section{
  margin-top:28px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.section-title h2{
  font-size:22px;
}

.see{
  background:none;
  color:#8166b5;
  font-weight:700;
}

/* SEARCH */

.search-box{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px;
  margin-bottom:16px;
  border-radius:18px;
  background:#ffffffaa;
  border:1px solid #ffffff;
  backdrop-filter:blur(15px);
}

.dark .search-box{
  background:#ffffff0d;
  border-color:#ffffff12;
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  background:none;
  color:inherit;
  font-size:16px;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:5px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.chip{
  white-space:nowrap;
  padding:10px 15px;
  border-radius:30px;
  background:#ffffff99;
  border:1px solid #ffffff;
  color:inherit;
}

.chip.active{
  background:#292238;
  color:white;
}

.dark .chip.active{
  background:#f6efff;
  color:#292238;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

.card{
  position:relative;
  overflow:hidden;
  min-height:245
