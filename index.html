<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6d8ff">
<meta name="description" content="Moodi — Find your mood. Create your vibe.">
<title>Moodi — Inspo & Edit</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  color:#292238;
  background:
    radial-gradient(circle at 10% 10%,#ffd9ec 0,transparent 30%),
    radial-gradient(circle at 90% 10%,#d9d8ff 0,transparent 30%),
    radial-gradient(circle at 50% 100%,#d7f5ff 0,transparent 35%),
    #faf8ff;
  transition:.3s;
}

body.dark{
  color:#f5f1ff;
  background:
    radial-gradient(circle at 10% 10%,#4c3152 0,transparent 30%),
    radial-gradient(circle at 90% 10%,#34366a 0,transparent 30%),
    #151321;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:min(1100px,100%);
  margin:auto;
  padding:20px 18px 100px;
}

/* HEADER */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:25px;
  font-weight:800;
}

.logo-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,#ffb7d8,#c9b8ff,#aeeaff);
  box-shadow:0 8px 25px #bda9df55;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#ffffff88;
  backdrop-filter:blur(15px);
  color:inherit;
  font-size:18px;
}

.dark .icon-btn{
  background:#ffffff12;
}

/* PAGES */

.page{
  display:none;
  animation:fade .25s ease;
}

.page.active{
  display:block;
}

@keyframes fade{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  min-height:250px;
  padding:30px;
  border:1px solid #ffffffaa;
  border-radius:30px;
  background:
    linear-gradient(135deg,#ffd7e9dd,#e2d8ffdd,#ccefffdd);
  box-shadow:0 18px 50px #9b83c530;
}

.dark .hero{
  background:linear-gradient(135deg,#472d48,#34335d,#273d4b);
  border-color:#ffffff15;
}

.hero::before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  right:-30px;
  top:-40px;
  border-radius:50%;
  background:#ffffff55;
}

.hero h1{
  position:relative;
  font-size:clamp(32px,7vw,58px);
  line-height:1;
  max-width:600px;
  margin-bottom:14px;
}

.hero p{
  position:relative;
  font-size:16px;
  opacity:.75;
  margin-bottom:24px;
}

.hero-buttons{
  position:relative;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.primary{
  padding:13px 19px;
  border-radius:15px;
  background:#292238;
  color:white;
  font-weight:700;
  box-shadow:0 8px 20px #29223830;
}

.dark .primary{
  background:#f6efff;
  color:#292238;
}

.secondary{
  padding:13px 19px;
  border-radius:15px;
  background:#ffffff80;
  color:inherit;
  font-weight:700;
  backdrop-filter:blur(10px);
}

/* SECTION */

.section{
  margin-top:28px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.section-title h2{
  font-size:22px;
}

.see{
  background:none;
  color:#8166b5;
  font-weight:700;
}

/* SEARCH */

.search-box{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px;
  margin-bottom:16px;
  border-radius:18px;
  background:#ffffffaa;
  border:1px solid #ffffff;
  backdrop-filter:blur(15px);
}

.dark .search-box{
  background:#ffffff0d;
  border-color:#ffffff12;
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  background:none;
  color:inherit;
  font-size:16px;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:5px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.chip{
  white-space:nowrap;
  padding:10px 15px;
  border-radius:30px;
  background:#ffffff99;
  border:1px solid #ffffff;
  color:inherit;
}

.chip.active{
  background:#292238;
  color:white;
}

.dark .chip.active{
  background:#f6efff;
  color:#292238;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

/* INSPO CARD */

.card{
  position:relative;
  overflow:hidden;
  min-height:245px;
  border-radius:24px;
  border:1px solid #ffffffaa;
  background:#ffffff77;
  backdrop-filter:blur(15px);
  box-shadow:0 12px 35px #8f78aa18;
  transition:.25s;
}

.dark .card{
  background:#ffffff0b;
  border-color:#ffffff12;
}

.card:hover{
  transform:translateY(-4px);
}

.card-art{
  height:180px;
  display:grid;
  place-items:center;
  font-size:65px;
  position:relative;
}

.art1{background:linear-gradient(135deg,#ffd4e7,#ddd2ff)}
.art2{background:linear-gradient(135deg,#d9f2ff,#e8ddff)}
.art3{background:linear-gradient(135deg,#ffe5c8,#ffd6e8)}
.art4{background:linear-gradient(135deg,#e0ffd8,#d8e9ff)}
.art5{background:linear-gradient(135deg,#e4d8ff,#ffcfe7)}
.art6{background:linear-gradient(135deg,#d3f8f0,#d9e2ff)}
.art7{background:linear-gradient(135deg,#cfc8ff,#e9d4ff)}
.art8{background:linear-gradient(135deg,#29264a,#65558c)}
.art9{background:linear-gradient(135deg,#ffd6b8,#d9d0ff)}
.art10{background:linear-gradient(135deg,#c9f3ff,#ffd7ed)}

.card-info{
  padding:13px;
}

.card-title{
  font-weight:800;
  margin-bottom:4px;
}

.card-cat{
  font-size:12px;
  opacity:.6;
}

.save{
  position:absolute;
  right:10px;
  top:10px;
  width:38px;
  height:38px;
  border-radius:13px;
  background:#ffffffcc;
  backdrop-filter:blur(10px);
  font-size:17px;
}

/* EDITOR */

.editor{
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
}

@media(min-width:750px){
  .editor{
    grid-template-columns:1.2fr .8fr;
  }
}

.preview{
  min-height:420px;
  display:grid;
  place-items:center;
  padding:20px;
  border-radius:28px;
  background:linear-gradient(145deg,#ffd5e7,#d8d1ff,#c8f0ff);
  box-shadow:0 18px 50px #8675a633;
}

.canvas{
  width:min(340px,90%);
  aspect-ratio:4/5;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  border-radius:28px;
  background:linear-gradient(135deg,#f9d7e8,#dcd6ff);
  box-shadow:0 20px 45px #6b5a7a35;
  text-align:center;
}

.canvas .emoji{
  font-size:75px;
}

.canvas .big-text{
  font-size:28px;
  font-weight:900;
}

.canvas .small-text{
  opacity:.65;
}

.controls{
  padding:20px;
  border-radius:26px;
  background:#ffffff88;
  border:1px solid #ffffffaa;
  backdrop-filter:blur(15px);
}

.dark .controls{
  background:#ffffff0d;
  border-color:#ffffff12;
}

.controls h3{
  margin-bottom:15px;
}

.control-group{
  margin-bottom:16px;
}

.control-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  opacity:.65;
}

.text-input{
  width:100%;
  padding:12px;
  border:1px solid #ffffff;
  outline:none;
  border-radius:13px;
  background:#ffffff80;
  color:inherit;
}

.dark .text-input{
  background:#ffffff10;
  border-color:#ffffff15;
}

.emoji-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.emoji-btn{
  width:43px;
  height:43px;
  border-radius:13px;
  background:#ffffffaa;
  font-size:20px;
}

.dark .emoji-btn{
  background:#ffffff12;
}

.full{
  width:100%;
}

/* SAVED / CREATIONS */

.empty{
  text-align:center;
  padding:60px 20px;
  border-radius:25px;
  background:#ffffff70;
  border:1px dashed #ffffff;
}

.dark .
